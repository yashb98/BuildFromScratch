<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BuildFromScratch · Skills (full text)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --peach-50:#FFF6F0;
    --peach-100:#FFE8D6;
    --peach-200:#FFD3B0;
    --peach-300:#FFB68A;
    --mint-50:#F1FBF6;
    --mint-100:#DDF5E8;
    --mint-200:#B7EBD2;
    --mint-300:#8DDDB8;
    --ink:#2B2A33;
    --ink-soft:#5A5A66;
    --ink-mute:#8A8A95;
  }
  html,body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif;color:var(--ink);}
  .font-display{font-family:'Fraunces',ui-serif,Georgia,serif;letter-spacing:-0.02em;}
  .font-mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  body{
    background:
      radial-gradient(900px 500px at -10% -10%, var(--peach-100) 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 0%, var(--mint-100) 0%, transparent 55%),
      #FFFDFB;
  }
  .glass{
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 20px 60px -30px rgba(60,40,30,0.18);
  }
  .chip{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .65rem;border-radius:9999px;font-size:.7rem;font-weight:600;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);}
  .dot{width:.4rem;height:.4rem;border-radius:9999px;display:inline-block;}

  /* ============ Markdown prose styling ============ */
  .prose-skill{font-size:15.5px;line-height:1.75;color:var(--ink);}
  .prose-skill > *+*{margin-top:.95rem;}
  .prose-skill h1{font-family:'Fraunces',serif;font-weight:600;font-size:2.4rem;line-height:1.1;letter-spacing:-0.02em;margin-top:2.2rem;}
  .prose-skill h2{font-family:'Fraunces',serif;font-weight:600;font-size:1.7rem;line-height:1.15;margin-top:2.6rem;padding-bottom:.5rem;border-bottom:1px solid rgba(43,42,51,0.08);scroll-margin-top:120px;}
  .prose-skill h3{font-family:'Fraunces',serif;font-weight:600;font-size:1.25rem;margin-top:2rem;scroll-margin-top:120px;}
  .prose-skill h4{font-weight:700;font-size:1rem;margin-top:1.4rem;}
  .prose-skill p{margin:0;}
  .prose-skill strong{color:var(--ink);font-weight:700;}
  .prose-skill em{color:var(--ink-soft);}
  .prose-skill a{color:#A65C2A;text-decoration:underline;text-decoration-color:rgba(166,92,42,.35);text-underline-offset:3px;}
  .prose-skill a:hover{text-decoration-color:#A65C2A;}
  .prose-skill ul, .prose-skill ol{padding-left:1.25rem;}
  .prose-skill ul{list-style:none;}
  .prose-skill ul > li{position:relative;padding-left:1rem;margin:.25rem 0;}
  .prose-skill ul > li::before{content:"";position:absolute;left:0;top:.7em;width:.35rem;height:.35rem;border-radius:9999px;background:var(--peach-300);}
  .prose-skill ol{list-style:none;counter-reset:olc;}
  .prose-skill ol > li{counter-increment:olc;position:relative;padding-left:1.9rem;margin:.3rem 0;}
  .prose-skill ol > li::before{
    content:counter(olc);position:absolute;left:0;top:.15em;
    width:1.35rem;height:1.35rem;border-radius:9999px;
    background:var(--mint-100);color:var(--ink);
    display:grid;place-items:center;font-size:.7rem;font-weight:700;font-family:'JetBrains Mono',monospace;
  }
  .prose-skill li > ul, .prose-skill li > ol{margin-top:.3rem;}
  .prose-skill code{
    font-family:'JetBrains Mono',monospace;font-size:.86em;
    background:rgba(255,232,214,0.55);
    border:1px solid rgba(255,182,138,0.25);
    padding:.08em .38em;border-radius:.4rem;color:#7A3B12;
  }
  .prose-skill pre{
    background:#FFFDFB;border:1px solid rgba(43,42,51,0.08);
    border-radius:1rem;padding:1rem 1.1rem;overflow-x:auto;
    box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset;
  }
  .prose-skill pre code{background:transparent;border:0;padding:0;color:var(--ink);font-size:.83em;line-height:1.65;}
  .prose-skill blockquote{
    border-left:3px solid var(--mint-300);
    padding:.4rem 1rem;background:var(--mint-50);
    border-radius:.6rem;color:var(--ink-soft);
  }
  .prose-skill hr{border:0;height:1px;background:linear-gradient(90deg,transparent,rgba(43,42,51,.15),transparent);margin:2.4rem 0;}
  .prose-skill table{border-collapse:collapse;width:100%;font-size:.92rem;}
  .prose-skill thead th{
    text-align:left;font-weight:700;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink-soft);padding:.6rem .7rem;background:var(--peach-50);
    border-bottom:1px solid rgba(43,42,51,.08);
  }
  .prose-skill tbody td{padding:.55rem .7rem;border-bottom:1px solid rgba(43,42,51,.06);vertical-align:top;}
  .prose-skill tbody tr:hover{background:rgba(255,246,240,.6);}
  .skill-peach h2, .skill-peach h3{color:#7A3B12;}
  .skill-mint h2, .skill-mint h3{color:#1F5C44;}
  .skill-mint .prose-skill code{background:rgba(221,245,232,0.65);border-color:rgba(141,221,184,0.35);color:#1F5C44;}
  .skill-mint .prose-skill ul > li::before{background:var(--mint-300);}
  .skill-mint .prose-skill ol > li::before{background:var(--peach-100);}
  .skill-mint .prose-skill thead th{background:var(--mint-50);}
  .skill-mint .prose-skill blockquote{border-left-color:var(--peach-300);background:var(--peach-50);}

  /* ============ TOC ============ */
  .toc a{
    display:block;padding:.32rem .65rem;border-radius:.5rem;
    font-size:.78rem;color:var(--ink-soft);line-height:1.35;
    border-left:2px solid transparent;
  }
  .toc a.lvl-3{padding-left:1.6rem;font-size:.74rem;color:var(--ink-mute);}
  .toc a:hover{background:rgba(255,255,255,.7);color:var(--ink);}
  .toc a.active{
    background:rgba(255,255,255,.85);color:var(--ink);font-weight:600;
    border-left-color:var(--peach-300);
  }
  .skill-mint .toc a.active{border-left-color:var(--mint-300);}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--peach-200);border-radius:9999px;}
  ::-webkit-scrollbar-track{background:transparent;}
  .reveal{opacity:0;transform:translateY(14px);}

  /* ============ Tool tester drawer ============ */
  .tt-fab{
    position:fixed;right:1.25rem;bottom:1.25rem;z-index:60;
    display:inline-flex;align-items:center;gap:.5rem;
    padding:.75rem 1.1rem;border-radius:9999px;font-weight:600;font-size:.85rem;
    background:linear-gradient(135deg, var(--peach-200), var(--mint-200));
    box-shadow:0 10px 30px -10px rgba(60,40,30,.35);
    border:1px solid rgba(255,255,255,.7);cursor:pointer;
  }
  .tt-drawer{
    position:fixed;right:1.25rem;bottom:1.25rem;z-index:55;
    width:min(440px, calc(100vw - 2rem));height:min(680px, calc(100vh - 2rem));
    display:flex;flex-direction:column;
    border-radius:1.5rem;overflow:hidden;
    background:rgba(255,253,251,.95);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.8);
    box-shadow:0 30px 60px -20px rgba(60,40,30,.3);
  }
  .tt-header{
    padding:.9rem 1.1rem;display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(90deg, var(--peach-50), var(--mint-50));
    border-bottom:1px solid rgba(43,42,51,.06);
  }
  .tt-tabs{display:flex;gap:.25rem;padding:.4rem;}
  .tt-tab{
    flex:1;padding:.4rem .6rem;border-radius:.6rem;font-size:.75rem;font-weight:600;
    background:transparent;border:0;cursor:pointer;color:var(--ink-soft);
  }
  .tt-tab.active{background:white;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .tt-body{flex:1;overflow:auto;padding:1rem;}
  .tt-row{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.65rem;}
  .tt-row label{font-size:.72rem;font-weight:600;color:var(--ink-soft);}
  .tt-input, .tt-textarea, .tt-select{
    width:100%;padding:.5rem .65rem;border-radius:.55rem;font-size:.82rem;
    border:1px solid rgba(43,42,51,.12);background:white;
    font-family:'JetBrains Mono',monospace;
  }
  .tt-textarea{min-height:90px;resize:vertical;}
  .tt-btn{
    padding:.55rem .9rem;border-radius:9999px;font-size:.78rem;font-weight:600;border:0;cursor:pointer;
    background:linear-gradient(135deg, var(--peach-200), var(--peach-100));
  }
  .tt-btn:disabled{opacity:.5;cursor:not-allowed;}
  .tt-result{
    margin-top:.6rem;padding:.7rem .8rem;border-radius:.7rem;
    background:#FFFDFB;border:1px solid rgba(43,42,51,.08);
    font-family:'JetBrains Mono',monospace;font-size:.74rem;
    max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-word;
  }
  .tt-result.err{border-color:#E8B0A0;background:#FFF6F2;color:#7A3B12;}
  .tt-pill{
    display:inline-block;padding:.1rem .5rem;border-radius:9999px;font-size:.65rem;font-weight:700;
    background:var(--mint-100);color:#1F5C44;margin-right:.3rem;
  }
  .tt-pill.warn{background:var(--peach-100);color:#7A3B12;}
  .tt-tool-card{
    padding:.55rem .75rem;border-radius:.7rem;border:1px solid rgba(43,42,51,.08);
    background:white;cursor:pointer;margin-bottom:.4rem;
  }
  .tt-tool-card.active{border-color:var(--peach-300);background:var(--peach-50);}
  .tt-tool-card h4{font-size:.82rem;font-weight:700;margin:0;}
  .tt-tool-card p{font-size:.7rem;color:var(--ink-soft);margin:.15rem 0 0;line-height:1.4;}

  /* ============ How it works — system diagram ============ */
  .hiw-grid{
    display:grid;grid-template-columns:repeat(4, 1fr);gap:1.5rem;
    align-items:center;position:relative;padding:2rem 0 4rem;
  }
  .hiw-node{
    position:relative;z-index:2;padding:1rem 1.1rem;border-radius:1.25rem;
    background:rgba(255,255,255,0.85);border:1px solid rgba(255,255,255,.9);
    transition:transform .35s ease, box-shadow .35s ease, background .35s ease, border-color .35s ease;
    box-shadow:0 4px 14px -8px rgba(60,40,30,0.1);
  }
  .hiw-node.active{
    background:white;
    box-shadow:0 0 0 3px rgba(255,182,138,.35), 0 18px 40px -16px rgba(60,40,30,0.22);
    transform:translateY(-3px);
  }
  .hiw-node.active.mint{box-shadow:0 0 0 3px rgba(141,221,184,.45), 0 18px 40px -16px rgba(31,92,68,0.18);}
  .hiw-node .ico{
    width:38px;height:38px;border-radius:.85rem;display:grid;place-items:center;font-size:1.15rem;
    background:linear-gradient(135deg, var(--peach-100), var(--mint-100));margin-bottom:.5rem;
  }
  .hiw-node .nm{font-weight:700;font-size:.92rem;line-height:1.1;}
  .hiw-node .sub{font-size:.7rem;color:var(--ink-soft);margin-top:.2rem;font-family:'JetBrains Mono',monospace;}
  .hiw-fs{
    grid-column:2 / span 2;margin-top:.5rem;
  }
  .hiw-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;}
  .hiw-edge{
    fill:none;stroke:rgba(43,42,51,.18);stroke-width:2;stroke-linecap:round;
    stroke-dasharray:6 6;
    transition:stroke .25s ease, stroke-width .25s ease;
  }
  .hiw-edge.active{stroke:var(--peach-300);stroke-width:2.4;animation:dashflow 1.2s linear infinite;}
  .hiw-edge.active.mint{stroke:var(--mint-300);}
  @keyframes dashflow{from{stroke-dashoffset:24;}to{stroke-dashoffset:0;}}

  .hiw-controls{
    display:flex;align-items:center;gap:.5rem;justify-content:center;margin:1rem 0;
    padding:.4rem;border-radius:9999px;
    background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);
    width:fit-content;margin-left:auto;margin-right:auto;
  }
  .hiw-ctl{
    padding:.45rem 1rem;border-radius:9999px;font-size:.82rem;font-weight:600;
    border:0;cursor:pointer;background:transparent;color:var(--ink-soft);
  }
  .hiw-ctl:hover{color:var(--ink);background:rgba(255,255,255,.7);}
  .hiw-ctl.primary{background:linear-gradient(135deg, var(--peach-200), var(--mint-200));color:var(--ink);}
  .hiw-ctl:disabled{opacity:.4;cursor:not-allowed;}

  .hiw-step-card{
    padding:1.5rem 1.7rem;border-radius:1.5rem;background:white;
    border:1px solid rgba(43,42,51,.06);
    box-shadow:0 8px 30px -18px rgba(60,40,30,.18);
  }
  .hiw-step-card .num{
    display:inline-grid;place-items:center;width:2.2rem;height:2.2rem;
    border-radius:9999px;background:linear-gradient(135deg, var(--peach-200), var(--mint-200));
    font-family:'Fraunces',serif;font-weight:700;font-size:1rem;
  }
  .hiw-payload{
    margin-top:1rem;padding:.85rem 1rem;border-radius:.85rem;
    background:#FFFDFB;border:1px solid rgba(43,42,51,.07);
    font-family:'JetBrains Mono',monospace;font-size:.74rem;line-height:1.55;
    white-space:pre-wrap;word-break:break-word;color:var(--ink);
    max-height:280px;overflow:auto;
  }
  .hiw-payload .k{color:#1F5C44;}
  .hiw-payload .s{color:#7A3B12;}

  .hiw-rail{
    display:flex;gap:.35rem;flex-wrap:wrap;margin:1rem 0;justify-content:center;
  }
  .hiw-rail .dot{
    width:.55rem;height:.55rem;border-radius:9999px;background:rgba(43,42,51,.12);
    cursor:pointer;transition:transform .2s ease, background .2s ease;
  }
  .hiw-rail .dot.done{background:var(--mint-200);}
  .hiw-rail .dot.cur{background:var(--peach-300);transform:scale(1.45);}

  .hiw-tool{
    padding:.85rem 1rem;border-radius:1rem;background:white;border:1px solid rgba(43,42,51,.06);
  }
  .hiw-tool .head{display:flex;align-items:center;justify-content:space-between;}
  .hiw-tool h5{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.85rem;margin:0;}
  .hiw-tool p{font-size:.78rem;color:var(--ink-soft);margin:.3rem 0 0;line-height:1.45;}
  .hiw-tool .policy{font-size:.65rem;font-weight:700;padding:.18rem .5rem;border-radius:9999px;}
  .hiw-tool .policy.auto{background:var(--mint-100);color:#1F5C44;}
  .hiw-tool .policy.gate{background:var(--peach-100);color:#7A3B12;}
  .hiw-tool .policy.ask{background:#EDE7F6;color:#4A3B7A;}

  /* ============ Series kit ============ */
  .sk-section-title{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}

  /* color swatches */
  .sk-swatch-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));gap:.75rem;}
  .sk-swatch{
    padding:1rem;border-radius:1rem;cursor:pointer;border:1px solid rgba(255,255,255,.7);
    box-shadow:0 4px 12px -8px rgba(60,40,30,.18);position:relative;transition:transform .2s ease;
  }
  .sk-swatch:hover{transform:translateY(-2px);}
  .sk-swatch .nm{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:700;color:var(--ink);}
  .sk-swatch .hx{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--ink-soft);margin-top:.2rem;}
  .sk-swatch.dark .nm, .sk-swatch.dark .hx{color:white;}
  .sk-swatch .copied{
    position:absolute;top:.4rem;right:.5rem;font-size:.6rem;font-weight:700;
    padding:.1rem .4rem;border-radius:9999px;background:rgba(255,255,255,.9);color:var(--ink);
    opacity:0;transition:opacity .25s ease;
  }
  .sk-swatch.copied-on .copied{opacity:1;}

  /* type system */
  .sk-type-row{
    display:grid;grid-template-columns:1.5fr 2fr 1fr;gap:1rem;align-items:center;
    padding:.85rem 1rem;border-radius:.85rem;background:white;border:1px solid rgba(43,42,51,.06);
    margin-bottom:.5rem;
  }
  .sk-type-label{font-size:.78rem;color:var(--ink-soft);}
  .sk-type-meta{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--ink-mute);text-align:right;}

  /* phone mockup */
  .sk-phone-stage{
    display:grid;grid-template-columns:auto 1fr;gap:2rem;align-items:start;
  }
  @media (max-width: 720px){.sk-phone-stage{grid-template-columns:1fr;}}
  .sk-phone{
    width:300px;aspect-ratio:9/16;position:relative;border-radius:2rem;overflow:hidden;
    background:
      linear-gradient(180deg, #1A1822 0%, #2B2A33 50%, #1A1822 100%);
    box-shadow:0 30px 60px -20px rgba(60,40,30,.4), 0 0 0 8px #1A1822;
  }
  .sk-phone-broll{
    position:absolute;inset:0;padding:1.2rem;font-family:'JetBrains Mono',monospace;
    font-size:.55rem;line-height:1.5;color:rgba(255,182,138,.6);
    background:
      linear-gradient(180deg, transparent 0%, rgba(0,0,0,.4) 100%),
      radial-gradient(circle at 30% 30%, rgba(255,211,176,.08), transparent 50%);
    overflow:hidden;
  }
  .sk-phone-broll .ln{display:block;white-space:nowrap;}
  .sk-phone-broll .ln.dim{color:rgba(141,221,184,.35);}
  .sk-phone-safe-top{position:absolute;top:0;left:0;right:0;height:13%;background:linear-gradient(180deg, rgba(0,0,0,.35), transparent);}
  .sk-phone-safe-bot{position:absolute;bottom:0;left:0;right:0;height:20%;pointer-events:none;}
  .sk-lower-third{
    position:absolute;left:.6rem;right:.6rem;bottom:21%;
    display:flex;align-items:center;gap:.55rem;
    padding:.55rem;border-radius:.85rem;
    background:rgba(255,253,251,.94);
    border:1px solid rgba(43,42,51,.06);
    box-shadow:0 12px 28px -12px rgba(0,0,0,.45);
  }
  .sk-lt-logo{
    width:38px;height:38px;border-radius:.6rem;display:grid;place-items:center;
    background:linear-gradient(135deg, var(--peach-200), var(--mint-200));
    font-family:'Fraunces',serif;font-weight:700;font-size:1.1rem;flex-shrink:0;
  }
  .sk-lt-content{flex:1;min-width:0;}
  .sk-lt-name{font-family:'Fraunces',serif;font-weight:600;font-size:.95rem;line-height:1.05;color:var(--ink);}
  .sk-lt-spec{font-family:'JetBrains Mono',monospace;font-size:.52rem;color:var(--ink-soft);margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sk-microline{
    position:absolute;left:.6rem;right:.6rem;bottom:14%;
    font-family:'Inter',sans-serif;font-weight:600;font-size:.55rem;
    color:rgba(255,255,255,.7);text-align:center;letter-spacing:.04em;
  }

  /* badges */
  .sk-badge{
    display:inline-flex;align-items:center;gap:.45rem;
    padding:.4rem .7rem;border-radius:9999px;
    font-family:'Inter',sans-serif;font-weight:700;
    flex-shrink:0;
  }
  .sk-badge .dot{width:.45rem;height:.45rem;border-radius:9999px;}
  .sk-badge .label{font-size:.6rem;letter-spacing:.06em;color:var(--ink);}
  .sk-badge .num{font-family:'JetBrains Mono',monospace;font-size:.55rem;font-weight:500;color:var(--ink-soft);margin-left:.15rem;}
  .sk-badge.fz{background:var(--peach-200);}
  .sk-badge.fz .dot{background:var(--peach-300);}
  .sk-badge.adapt{background:var(--mint-200);}
  .sk-badge.adapt .dot{background:var(--mint-300);}

  .sk-badge.lg{padding:.6rem 1rem;}
  .sk-badge.lg .label{font-size:.82rem;letter-spacing:.08em;}
  .sk-badge.lg .num{font-size:.75rem;}
  .sk-badge.lg .dot{width:.55rem;height:.55rem;}

  /* phone variant overlays */
  .sk-phone .stat-overlay{
    position:absolute;left:1rem;right:1rem;top:45%;transform:translateY(-50%);
    padding:1rem .85rem;border-radius:1rem;text-align:center;
    background:rgba(43,42,51,.85);backdrop-filter:blur(4px);
  }
  .sk-phone .stat-overlay .big{font-family:'Fraunces',serif;font-weight:700;font-size:1.6rem;color:white;line-height:1;}

<script type="text/babel">
const { useEffect, useRef, useState, useMemo } = React;

const SKILLS = [
  {
    id: "from-scratch-build",
    file: "from-scratch-build.md",
    accent: "peach",
    icon: "🧪",
    invoke: "/from-scratch-build",
    tagline: "Research → implement → verify → train → evaluate. From a blank model.py to a verified, trained model.",
  },
  {
    id: "finance-research-loop",
    file: "finance-research-loop.md",
    accent: "mint",
    icon: "📈",
    invoke: "/finance-research-loop",
    tagline: "Survey fine-tuning methods, write a plan, tune HPs, train, and evaluate against forgetting.",
  },
];

function useMarkdown(file) {
  const [state, setState] = useState({ html: "", headings: [], loading: true, error: null, raw: "" });
  useEffect(() => {
    let cancelled = false;
    setState(s => ({ ...s, loading: true, error: null }));
    fetch(file)
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(text => {
        // Strip YAML frontmatter so it doesn't render as a code block / paragraph.
        const stripped = text.replace(/^---\n[\s\S]*?\n---\n?/, "");

        // Slugger for stable IDs
        const seen = new Map();
        const slug = (txt) => {
          let s = String(txt).toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
          if (!s) s = "section";
          const n = seen.get(s) || 0; seen.set(s, n + 1);
          return n === 0 ? s : `${s}-${n}`;
        };

        // Customize marked to inject heading ids + collect headings for the TOC.
        const headings = [];
        const renderer = new marked.Renderer();
        const origHeading = renderer.heading.bind(renderer);
        renderer.heading = (text, level, rawText) => {
          // text may include nested HTML for inline code; strip tags for slug + label.
          const plain = String(rawText ?? text).replace(/<[^>]+>/g, "");
          const id = slug(plain);
          if (level === 2 || level === 3) headings.push({ id, text: plain, level });
          return `<h${level} id="${id}">${text}</h${level}>`;
        };

        marked.setOptions({ renderer, breaks: false, gfm: true, headerIds: false, mangle: false });
        const rawHtml = marked.parse(stripped);
        const clean = (window.DOMPurify ? DOMPurify.sanitize(rawHtml, { ADD_ATTR: ['id'] }) : rawHtml);
        if (!cancelled) setState({ html: clean, headings, loading: false, error: null, raw: stripped });
      })
      .catch(err => { if (!cancelled) setState({ html: "", headings: [], loading: false, error: err.message, raw: "" }); });
    return () => { cancelled = true; };
  }, [file]);
  return state;
}

function Nav({ active, setActive }) {
  return (
    <nav className="relative z-30 max-w-7xl mx-auto px-6 md:px-10 pt-7 flex items-center justify-between">
      <div className="flex items-center gap-2.5">
        <div className="w-9 h-9 rounded-2xl grid place-items-center"
             style={{background:"linear-gradient(135deg, var(--peach-200), var(--mint-200))"}}>
          <span className="font-display font-bold">B</span>
        </div>
        <div className="leading-tight">
          <div className="font-display font-semibold">BuildFromScratch</div>
          <div className="text-xs text-[color:var(--ink-soft)]">skills · full text</div>
        </div>
      </div>
      <div className="hidden md:flex items-center gap-1 p-1 rounded-full glass">
        <button onClick={() => setActive("how-it-works")}
          className={"px-4 py-2 rounded-full text-sm font-medium transition " +
            (active === "how-it-works" ? "bg-white shadow-sm" : "hover:bg-white/70")}>
          <span className="mr-1.5">✦</span>How it works
        </button>
        <button onClick={() => setActive("series-kit")}
          className={"px-4 py-2 rounded-full text-sm font-medium transition " +
            (active === "series-kit" ? "bg-white shadow-sm" : "hover:bg-white/70")}>
          <span className="mr-1.5">🎬</span>Series kit
        </button>
        {SKILLS.map(s => (
          <button key={s.id} onClick={() => setActive(s.id)}
            className={"px-4 py-2 rounded-full text-sm font-medium transition " +
              (active === s.id ? "bg-white shadow-sm" : "hover:bg-white/70")}>
            <span className="mr-1.5">{s.icon}</span>{s.id}
          </button>
        ))}
      </div>
      <a href={"#" + (SKILLS.find(s=>s.id===active)?.id || "")}
         className="hidden md:inline-flex items-center gap-2 px-4 py-2 rounded-full text-sm font-semibold"
         style={{background:"linear-gradient(135deg, var(--peach-200), var(--mint-200))"}}>
        Top ↑
      </a>
    </nav>
  );
}

function Hero({ active }) {
  const s = SKILLS.find(x => x.id === active);
  const titleRef = useRef(null);
  useEffect(() => {
    if (!titleRef.current) return;
    gsap.fromTo(titleRef.current.querySelectorAll(".tline"),
      { y: 24, opacity: 0 },
      { y: 0, opacity: 1, stagger: 0.07, duration: 0.7, ease: "power3.out" });
  }, [active]);
  const accentBg = s.accent === "peach" ? "var(--peach-100)" : "var(--mint-100)";
  const accentDot = s.accent === "peach" ? "var(--peach-300)" : "var(--mint-300)";
  return (
    <header className="relative z-10 max-w-7xl mx-auto px-6 md:px-10 pt-10 pb-6">
      <div className="chip mb-4" style={{background:accentBg}}>
        <span className="dot" style={{background:accentDot}}/> reading · full SKILL.md
      </div>
      <h1 ref={titleRef} className="font-display text-4xl md:text-6xl font-semibold leading-[1.05]">
        <div className="tline">{s.icon} {s.id}</div>
        <div className="tline text-[color:var(--ink-soft)] text-2xl md:text-3xl font-normal mt-2">{s.tagline}</div>
      </h1>
      <div className="mt-4 flex flex-wrap gap-2 text-sm">
        <span className="chip">invoke <code className="ml-1 font-mono">{s.invoke}</code></span>

}

function Toc({ headings, activeId, onPick }) {
  return (
    <nav className="toc">
      <div className="text-[10px] uppercase tracking-wider text-[color:var(--ink-mute)] mb-2 px-2">On this page</div>
      <div className="max-h-[70vh] overflow-y-auto pr-1">
        {headings.length === 0 && <div className="text-xs text-[color:var(--ink-mute)] px-2">No sections</div>}
        {headings.map(h => (
          <a key={h.id} href={"#" + h.id}
             className={"lvl-" + h.level + (activeId === h.id ? " active" : "")}
             onClick={(e) => { e.preventDefault(); onPick(h.id); }}>
            {h.text}
          </a>
        ))}
      </div>
    </nav>
  );
}

function SkillReader({ skill }) {
  const { html, headings, loading, error } = useMarkdown(skill.file);
  const proseRef = useRef(null);
  const [activeId, setActiveId] = useState("");

  // Reveal on mount / when content changes
  useEffect(() => {
    if (loading || !proseRef.current) return;
    gsap.fromTo(proseRef.current, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" });
  }, [loading, skill.id]);

  // Scrollspy: track which heading is in view.
  useEffect(() => {
    if (loading || !proseRef.current) return;
    const hs = proseRef.current.querySelectorAll("h2[id], h3[id]");
    if (!hs.length) return;
    const io = new IntersectionObserver((entries) => {
      const visible = entries.filter(e => e.isIntersecting)
                             .sort((a,b) => a.target.offsetTop - b.target.offsetTop);
      if (visible.length) setActiveId(visible[0].target.id);
    }, { rootMargin: "-120px 0px -70% 0px", threshold: 0 });
    hs.forEach(h => io.observe(h));
    return () => io.disconnect();
  }, [html, loading]);

  const onPick = (id) => {
    const el = document.getElementById(id);
    if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); setActiveId(id); }
  };

  const skinClass = "skill-" + skill.accent;

  return (
    <div className={"max-w-7xl mx-auto px-6 md:px-10 pb-24 " + skinClass}>
      <div className="grid grid-cols-12 gap-8">
        <aside className="hidden lg:block lg:col-span-3">
          <div className="sticky top-6 p-4 rounded-2xl glass">
            <Toc headings={headings} activeId={activeId} onPick={onPick}/>
          </div>
        </aside>
        <main className="col-span-12 lg:col-span-9">
          <article className="p-6 md:p-10 rounded-[1.75rem] glass">
            {loading && <div className="text-[color:var(--ink-soft)] text-sm">Loading <code>{skill.file}</code>…</div>}
            {error && (
              <div className="text-sm">
                <div className="font-semibold text-red-700">Failed to load {skill.file}</div>
                <div className="text-[color:var(--ink-soft)] mt-1">{error}</div>
              </div>
            )}
            {!loading && !error && (
              <div ref={proseRef} className="prose-skill" dangerouslySetInnerHTML={{ __html: html }}/>
            )}
          </article>
          <div className="mt-4 text-xs text-[color:var(--ink-mute)] px-2">
            Source: <code>{skill.file}</code> · rendered verbatim from <code>.claude/skills/{skill.id}/SKILL.md</code>
          </div>
        </main>

// 5 fixed positions in the diagram (percent within the SVG viewBox 1000x340).
// Used by both the node CSS-grid layout and the SVG edge path drawing.
const NODE_POS = {
  user:    { cx:  90, cy: 100, label: "You",      icon: "🧑", sub: "browser / CLI" },
  browser: { cx: 320, cy: 100, label: "React UI", icon: "🪞", sub: "index.html" },
  server:  { cx: 560, cy: 100, label: "FastAPI",  icon: "⚙️", sub: "server/main.py" },
  claude:  { cx: 900, cy: 100, label: "Claude",   icon: "✦",  sub: "claude-opus-4-7" },
  fs:      { cx: 560, cy: 270, label: "FS · Shell", icon: "🗂", sub: "tools.py + safety.py" },
};

// Edge definitions: [from, to, accent ('peach' | 'mint')]
const EDGES = [
  ["user-browser",   "user",    "browser", "peach"],
  ["browser-server", "browser", "server",  "peach"],
  ["server-claude",  "server",  "claude",  "mint"],
  ["server-fs",      "server",  "fs",      "peach"],
];

function SystemDiagram({ activeNodes, activeEdges }) {
  // Build an SVG curve between two node centres (uses node coords from NODE_POS).
  const edgePath = (from, to) => {
    const a = NODE_POS[from], b = NODE_POS[to];
    if (!a || !b) return "";
    if (a.cy === b.cy) {
      // horizontal curve
      const mx = (a.cx + b.cx) / 2;
      return `M ${a.cx + 60} ${a.cy} C ${mx} ${a.cy}, ${mx} ${b.cy}, ${b.cx - 60} ${b.cy}`;
    }
    // vertical-ish (server → fs)
    return `M ${a.cx} ${a.cy + 30} C ${a.cx} ${a.cy + 90}, ${b.cx} ${b.cy - 90}, ${b.cx} ${b.cy - 30}`;
  };

  return (
    <div className="relative">
      <svg className="hiw-svg" viewBox="0 0 1000 340" preserveAspectRatio="none">
        {EDGES.map(([id, from, to, accent]) => (
          <path key={id} d={edgePath(from, to)}
            className={"hiw-edge" + (activeEdges.includes(id) ? " active " + accent : "")}/>
        ))}
      </svg>

      <div className="hiw-grid">
        {["user", "browser", "server", "claude"].map(k => {
          const n = NODE_POS[k];
          const isActive = activeNodes.includes(k);
          const accent = k === "claude" ? "mint" : "";
          return (
            <div key={k} className={"hiw-node " + accent + (isActive ? " active" : "")}>
              <div className="ico">{n.icon}</div>
              <div className="nm">{n.label}</div>
              <div className="sub">{n.sub}</div>
            </div>
          );
        })}
        <div className={"hiw-node hiw-fs" + (activeNodes.includes("fs") ? " active" : "")}>
          <div className="flex items-center gap-3">
            <div className="ico" style={{margin:0}}>{NODE_POS.fs.icon}</div>
            <div>
              <div className="nm">{NODE_POS.fs.label}</div>
              <div className="sub">{NODE_POS.fs.sub} · workspace-scoped</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function PayloadView({ payload }) {
  if (payload === undefined || payload === null) return null;
  // Simple syntax highlight: keys in mint, string values in peach.
  const json = JSON.stringify(payload, null, 2);
  const highlighted = json
    .replace(/("(?:[^"\\]|\\.)*")(\s*:)/g, '<span class="k">$1</span>$2')
    .replace(/:\s*("(?:[^"\\]|\\.)*")/g, ': <span class="s">$1</span>');
  return <pre className="hiw-payload" dangerouslySetInnerHTML={{ __html: highlighted }}/>;
}

function StepPlayer() {
  const [i, setI] = useState(0);
  const [playing, setPlaying] = useState(false);
  const step = WALKTHROUGH[i];
  const cardRef = useRef(null);

  // Auto-advance when playing.
  useEffect(() => {
    if (!playing) return;
    const t = setTimeout(() => {
      setI(p => (p + 1 < WALKTHROUGH.length ? p + 1 : (setPlaying(false), p)));
    }, 3500);
    return () => clearTimeout(t);
  }, [playing, i]);

  // Fade animation on step change.
  useEffect(() => {
    if (!cardRef.current) return;
    gsap.fromTo(cardRef.current, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" });
  }, [i]);

  return (
    <>
      <SystemDiagram activeNodes={step.active} activeEdges={step.edges}/>

      <div className="hiw-controls">
        <button className="hiw-ctl" onClick={() => { setPlaying(false); setI(0); }} disabled={i === 0 && !playing}>↺ Restart</button>
        <button className="hiw-ctl" onClick={() => { setPlaying(false); setI(p => Math.max(0, p - 1)); }} disabled={i === 0}>← Prev</button>
        <button className="hiw-ctl primary" onClick={() => setPlaying(p => !p)}>
          {playing ? "⏸ Pause" : "▶ Play"}
        </button>
        <button className="hiw-ctl" onClick={() => { setPlaying(false); setI(p => Math.min(WALKTHROUGH.length - 1, p + 1)); }} disabled={i === WALKTHROUGH.length - 1}>Next →</button>
      </div>

      <div className="hiw-rail">
        {WALKTHROUGH.map((_, idx) => (
          <span key={idx} onClick={() => { setPlaying(false); setI(idx); }}
                className={"dot" + (idx === i ? " cur" : idx < i ? " done" : "")}/>
        ))}
      </div>

      <div ref={cardRef} className="hiw-step-card mt-2">
        <div className="flex items-start gap-4">
          <div className="num">{step.n}</div>
          <div className="flex-1">
            <h3 className="font-display text-2xl font-semibold leading-tight">{step.title}</h3>
            <p className="mt-2 text-[color:var(--ink-soft)] leading-relaxed">{step.desc}</p>
          </div>
          <div className="text-xs font-mono text-[color:var(--ink-mute)]">{step.n + 1} / {WALKTHROUGH.length}</div>
        </div>
        <PayloadView payload={step.payload}/>
      </div>
    </>
  );
}

function ToolCatalog() {
  const [tools, setTools] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    fetch("/api/tools").then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(setTools).catch(e => setErr(String(e)));
  }, []);

  const policy = (name) => {
    if (!tools) return null;
    if (tools.interactive?.includes(name)) return { cls: "ask", label: "interactive" };
    if (tools.requires_approval?.includes(name)) return { cls: "gate", label: "approval" };
    return { cls: "auto", label: "auto-run" };
  };

  if (err) {
    return (
      <div className="hiw-step-card mt-4 text-sm">
        Couldn't reach the server: <code>{err}</code>. Start it with <code>./skills_showcase/server/run.sh</code>.
      </div>
    );
  }
  if (!tools) return <div className="text-[color:var(--ink-soft)] text-sm mt-4">loading tools…</div>;

  return (
    <div className="grid sm:grid-cols-2 gap-3 mt-2">
      {tools.tools.map(t => {
        const p = policy(t.name);
        return (
          <div key={t.name} className="hiw-tool">
            <div className="head">
              <h5>{t.name}</h5>
              {p && <span className={"policy " + p.cls}>{p.label}</span>}
            </div>
            <p>{t.description}</p>
            <div className="mt-2 text-[11px] text-[color:var(--ink-mute)]">
              required: {(t.input_schema.required || []).map(r => <code key={r} className="mr-1">{r}</code>)}
              {(!t.input_schema.required || t.input_schema.required.length === 0) && <em>none</em>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function SwatchCard({ swatch }) {
  const [copied, setCopied] = useState(false);
  const onClick = () => {
    navigator.clipboard?.writeText(swatch.hex).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1100);

  };
  return (
    <div className={"sk-swatch" + (swatch.dark ? " dark" : "") + (copied ? " copied-on" : "")}
         onClick={onClick}
         style={{ background: swatch.hex }}>
      <div className="nm">{swatch.name}</div>
      <div className="hx">{swatch.hex}</div>
      <div className="copied">copied</div>
    </div>
  );
}

// =============== Tool Tester drawer ===============

const TT_DEFAULTS = {
  read_file: { path: "skills_showcase/index.html", offset: 0, limit: 20 },
  list_dir: { path: "." },
  glob: { pattern: "**/*.py", path: "." },
  grep: { pattern: "class\\s+\\w+", path: "SmolLM2-134(base)", glob: "*.py" },
  write_file: { path: "skills_showcase/scratch/hello.txt", content: "hello from the tool layer\n" },
  bash: { command: "ls -la", cwd: "." },
  ask_user: { question: "Which option?", options: ["A", "B"] },
};

function ToolTesterDrawer({ open, onClose }) {
  const [tools, setTools] = useState(null);
  const [health, setHealth] = useState(null);
  const [activeTool, setActiveTool] = useState(null);
  const [argsText, setArgsText] = useState("{}");
  const [running, setRunning] = useState(false);
  const [result, setResult] = useState(null);
  const [tab, setTab] = useState("tools"); // "tools" | "health"

  // Fetch tool list when drawer opens.
  useEffect(() => {
    if (!open || tools) return;
    fetch("/api/tools").then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(d => { setTools(d); if (d.tools?.length) pickTool(d.tools[0]); })
      .catch(e => setResult({ ok: false, error: "GET /api/tools failed: " + e + " — is the FastAPI server running on :8000?" }));
    fetch("/api/health").then(r => r.ok ? r.json() : null).then(setHealth).catch(() => {});
  }, [open]);

  const pickTool = (t) => {
    setActiveTool(t);
    const defaults = TT_DEFAULTS[t.name] || {};
    setArgsText(JSON.stringify(defaults, null, 2));
    setResult(null);
  };

  const run = async () => {
    if (!activeTool) return;
    let parsed;
    try { parsed = JSON.parse(argsText); }
    catch (e) { setResult({ ok: false, error: "input is not valid JSON: " + e.message }); return; }
    setRunning(true);
    setResult(null);
    try {
      const r = await fetch("/api/tools/" + activeTool.name, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ input: parsed }),
      });
      const data = await r.json();
      setResult(data);
    } catch (e) {
      setResult({ ok: false, error: "fetch failed: " + e.message });
    } finally {
      setRunning(false);
    }
  };

  if (!open) return null;

  const requiresApproval = tools?.requires_approval?.includes(activeTool?.name);
  const interactive = tools?.interactive?.includes(activeTool?.name);

  return (
    <div className="tt-drawer">
      <div className="tt-header">
        <div className="flex items-center gap-2">
          <span className="dot" style={{background:"var(--peach-300)"}}/>
          <strong className="font-display text-base">Tool tester</strong>
          {health && (
            <span className="text-[10px] text-[color:var(--ink-soft)] font-mono ml-2">
              {health.workspace?.split("/").slice(-2).join("/")}
            </span>
          )}
        </div>
        <button onClick={onClose} className="text-xs text-[color:var(--ink-soft)] hover:text-[color:var(--ink)]">close</button>
      </div>

      <div className="tt-tabs">
        <button className={"tt-tab" + (tab==="tools"?" active":"")} onClick={()=>setTab("tools")}>Tools</button>
        <button className={"tt-tab" + (tab==="health"?" active":"")} onClick={()=>setTab("health")}>Server</button>
      </div>

      <div className="tt-body">
        {tab === "health" && (
          <div>
            <div className="text-xs uppercase tracking-wider text-[color:var(--ink-soft)] mb-2">Health</div>
            <pre className="tt-result">{health ? JSON.stringify(health, null, 2) : "loading…"}</pre>
            <div className="text-xs uppercase tracking-wider text-[color:var(--ink-soft)] mt-4 mb-2">Endpoints</div>
            <ul className="text-xs space-y-1">
              <li><code>GET /api/health</code></li>
              <li><code>GET /api/tools</code></li>
              <li><code>POST /api/tools/&lt;name&gt;</code> body: <code>{"{\"input\":{...}}"}</code></li>
              <li><code>POST /api/agent/run</code> body: <code>{"{\"skill\":\"...\",\"message\":\"...\"}"}</code></li>
              <li><code>GET /api/agent/stream/&lt;session_id&gt;</code> SSE</li>
              <li><code>POST /api/agent/respond</code></li>
            </ul>
            {health && !health.anthropic_key_present && (
              <div className="mt-3 text-xs p-2 rounded-lg" style={{background:"var(--peach-50)", color:"#7A3B12"}}>
                ANTHROPIC_API_KEY not set — direct tool endpoints work, but the in-browser agent loop is disabled. Drive the tools from Claude CLI via curl for now.
              </div>
            )}
          </div>
        )}

        {tab === "tools" && (
          <>
            <div className="text-xs uppercase tracking-wider text-[color:var(--ink-soft)] mb-2">Pick a tool</div>
            {tools?.tools?.map(t => (
              <div key={t.name} className={"tt-tool-card" + (activeTool?.name===t.name?" active":"")} onClick={()=>pickTool(t)}>
                <h4>
                  {t.name}
                  {tools.requires_approval.includes(t.name) && <span className="tt-pill warn ml-2">approval</span>}
                  {tools.interactive.includes(t.name) && <span className="tt-pill ml-2">interactive</span>}
                </h4>
                <p>{t.description}</p>
              </div>
            ))}
            {!tools && <div className="text-xs text-[color:var(--ink-soft)]">loading tools…</div>}

            {activeTool && (
              <div className="mt-4">
                <div className="text-xs uppercase tracking-wider text-[color:var(--ink-soft)] mb-2">Input JSON</div>
                <div className="tt-row">
                  <textarea className="tt-textarea" value={argsText} onChange={e=>setArgsText(e.target.value)} spellCheck={false}/>
                </div>
                <div className="flex items-center justify-between">
                  <div className="text-[11px] text-[color:var(--ink-soft)]">
                    POST <code>/api/tools/{activeTool.name}</code>
                  </div>
                  <button className="tt-btn" onClick={run} disabled={running}>
                    {running ? "running…" : "▶ Run"}
                  </button>
                </div>
                {(requiresApproval || interactive) && (
                  <div className="mt-2 text-[11px] text-[color:var(--ink-soft)]">
                    {interactive
                      ? "In the agent loop this would pause for a user answer; the direct endpoint just echoes the question."
                      : "In the agent loop this would pause for explicit approval before running."}
                  </div>
                )}
                {result && (
                  <pre className={"tt-result" + (result.ok===false?" err":"")}>{JSON.stringify(result, null, 2)}</pre>
                )}
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function App() {
  const [active, setActive] = useState("how-it-works");
  const [drawerOpen, setDrawerOpen] = useState(false);
  const skill = SKILLS.find(s => s.id === active);
  useEffect(() => { window.scrollTo({ top: 0, behavior: "smooth" }); }, [active]);
  return (
    <div className="relative">
      <Nav active={active} setActive={setActive}/>
      {active === "how-it-works" ? (
        <HowItWorksView/>
      ) : active === "series-kit" ? (
        <SeriesKitView/>
      ) : skill ? (
        <>
          <Hero active={active}/>
          <SkillReader key={skill.id} skill={skill}/>
        </>
      ) : null}
      {!drawerOpen && (
        <button className="tt-fab" onClick={()=>setDrawerOpen(true)}>
          🛠 Tool tester
        </button>
      )}
      <ToolTesterDrawer open={drawerOpen} onClose={()=>setDrawerOpen(false)}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
